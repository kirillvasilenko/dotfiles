# Escape delay (needed for Vim / Neovim)
set -sg escape-time 10

# Enable focus events
set -g focus-events on

# Inside tmux, $TERM must be a tmux terminfo — not xterm-256color.
# Truecolor + OSC 52/11 must be advertised on the *outer* TERM (Warp / WezTerm).
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ',xterm-256color:Ms=\E]52;%p1%s;%p2%s\007'

# Forward OSC 11 (nvim light/dark) and OSC 52 (clipboard) to the outer terminal.
# Requires tmux 3.3+ (nixpkgs). 3.0a will error on this line — use nix tmux.
set -g allow-passthrough on
set -s set-clipboard on

# Wheel scroll / mouse selection. Shift+drag still uses Warp's native select.
set -g mouse on

# Hide the green status bar. Session still works (tmux ls / attach).
set -g status off

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
