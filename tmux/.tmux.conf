# Escape delay (needed for Vim / Neovim)
set -sg escape-time 10

# Enable focus events
set -g focus-events on

# Inside tmux, $TERM must be a tmux terminfo — not xterm-256color.
# Truecolor + OSC 52/11 must be advertised on the *outer* TERM (Warp / WezTerm).
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ',xterm-256color:Ms=\E]52;%p1%s;%p2%s\007'

# Forward OSC 11 (nvim light/dark) and OSC 52 (clipboard) to the outer terminal.
# Requires tmux 3.3+ (nixpkgs). 3.0a will error on this line — use nix tmux.
set -g allow-passthrough on
set -s set-clipboard on

# Wheel scroll / mouse selection. Shift+drag still uses Warp's native select.
set -g mouse on

# Hide the green status bar. Session still works (tmux ls / attach).
set -g status off
